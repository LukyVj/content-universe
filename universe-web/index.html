<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Universe</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="universe"></canvas>
    <aside id="hud">
      <strong>Content Universe</strong>
      <span id="stats">Connecting to Strapi…</span>
    </aside>
    <ol id="log"></ol>

    <button
      id="bigbang-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="bigbang"
    >
      ✦ Big Bang
    </button>
    <form id="bigbang" hidden>
      <header>
        <span class="preview" aria-hidden="true"></span>
        <div>
          <strong>New planet</strong>
          <small>Saved in Strapi, born in 3D</small>
        </div>
      </header>

      <label
        >Name
        <input
          name="name"
          required
          maxlength="40"
          placeholder="Strapi Prime II"
      /></label>
      <label
        >Star
        <select name="star" required></select
      ></label>

      <div class="row">
        <label>Color <input name="color" type="color" value="#4945ff" /></label>
        <label
          >Material
          <select name="material">
            <option>rock</option>
            <option>metal</option>
            <option>glass</option>
            <option selected>jelly</option>
            <option>gold</option>
          </select>
        </label>
      </div>

      <label
        >Size <output name="radiusOut">0.30</output>
        <input
          name="radius"
          type="range"
          min="0.1"
          max="0.6"
          step="0.01"
          value="0.3"
      /></label>
      <label
        >Orbit <output name="orbitOut">8.0</output>
        <input name="orbit" type="range" min="2" max="14" step="0.1" value="8"
      /></label>
      <label
        >Speed (s per turn) <output name="speedOut">16</output>
        <input name="speed" type="range" min="3" max="40" step="1" value="16"
      /></label>

      <label class="check"><input name="rings" type="checkbox" /> Rings</label>

      <button type="submit">Create the planet</button>
      <p class="status" role="status"></p>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
